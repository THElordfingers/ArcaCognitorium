  - solar_storm
  - storm
  - inauspicious
  - rahu_kalam
 
# Named alignments with weight bonuses
special_alignments:
  - condition: "solar_ingress:Virgo"
    label: "Sun enters Archivist's domain"
    weight_bonus: 0.30
  - condition: "solar_ingress:Capricorn"
    label: "Deep winter — the Archivist ascends"
    weight_bonus: 0.20
  - condition: "dasha:Mercury"
    label: "Mercury mahadasha — the Archivist speaks clearly"
    weight_bonus: 0.15
