# Weight blending — circadian matters more; the Archivist is rhythm-driven
circadian_weight: 0.45
celestial_weight: 0.35
solar_weight: 0.10
tidal_weight: 0.10
 
# Dasha affinities — Mercury and Saturn dashas favour the Archivist
dasha_affinities:
  Mercury: 0.25
  Saturn: 0.18
  Moon: 0.12
