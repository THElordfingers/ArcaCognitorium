  verbosity: 0.5
  challenge: 0.7
  speculation: 0.4
  structure: 0.6
  warmth: 0.8
  precision: 0.7
presentation:
  default_sampling_profile: anchor
  bubble_width_pct: 65
summoned_only: false
uninvited_eligible: true
interruption_presence_weight: 0.35
