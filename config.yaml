app:
  name: "Arca Cognitorium"
  version: "v1.1_core-implementations"
  timezone: "local"

api:
  api_key: null
  api_key_env_var: "CLAUDE_API_KEY"
  timeout_seconds: 120

ui:
  show_timestamps: false
  show_model_badge: true
  typing_delay_seconds: 0.012  # typing effect base delay per character12  # typing effect base delay per character

  menu:
    max_items: 12

keys:
  submit_message: "f2"

  # Konsole steals Ctrl+1/2/3 and Alt+1/2/3 for tab switching.
  # Function keys are reliably delivered to TUIs.
  focus_left: "f6"
  focus_middle: "f7"
  focus_right: "f8"

  copy_last: "ctrl+y"

models:
  smart: "claude-opus-4-6"
  fast: "claude-sonnet-4-6"
  nano: "claude-haiku-4-5-20251001"
  summary: "claude-haiku-4-5-20251001"
  code: "claude-sonnet-4-6"

routing:
  smart_threshold: 0.55
  reflection_window: 50
  default: "fast"
  long_input_threshold_chars: 2000
  reasoning_keywords:
    - explain
    - derive
    - architecture
    - proof
    - analyze
    - design

    
memory:
  short_term_max_messages: 24
  retrieve_top_k: 5
  min_relevance_score: 0.20
  assessor_interval_turns: 5                                        # Background Assessor fires every N turns
  summarize:                                                        ##   Minimum thread size before firing: 3 exchanges    
    enabled: true                                                   ##   Set to 0 to disable background assessment
    trigger_after_messages: 18
    keep_last_messages: 10
  distillation_threshold: 6000                                      # token estimate to trigger distillation
  distillation_min_messages: 6000                                   # minimum thread length before distillation fires
  distillation_compress_model: "claude-haiku-4-5-20251001"          # model used for _compress() call
  chronicle_auto_extract: true                                      # whether distillation feeds Chronicle
  archivist_interval_turns: 8                                       # Background Archivist fires every N turns
                                                                    ##  Needs more context than Assessor — fires less often
                                                                    ##  Set to 0 to disable
  
storage:
  conversations_dir: "storage/conversations"
  vectors_path: "storage/vectors/vectors.pkl"
  immutable_log_path: "storage/logs/immutable.jsonl"
  reflection_log_path: "storage/logs/reflections.jsonl"
  
logging:
  enabled: true
  log_user_messages: true
  log_assistant_messages: true

reflection:
    enabled: true
    reflection_interval_turns: 10
    model: "claude-haiku-4-5-20251001"
    max_suggestions: 5

boot:
  boot_enabled: true
  banner_fonts:
    - slant
    - big
    - banner3
  boot_lines:
    - "The fire is lit. What troubles the Wizard?"
    - "The Arca Cognitorium stirs."
    - "All threads accounted for. The Chronicle is ready."
    - "Luminarious attends."

#animations:
#  master_enabled: true
#  glyph_drift: true
#  color_temp_drift: true
#  background_pulse: true
#  event_effects: true


dev:
  emerge_all: true     # Force all entities emerged. Remove before release.
