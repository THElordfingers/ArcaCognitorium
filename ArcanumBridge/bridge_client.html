<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arcanum Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --void:      #050507;
    --void2:     #0a0a0f;
    --void3:     #12121a;
    --border:    #2a2a3a;
    --gold:      #c8a84b;
    --gold-dim:  #7a6530;
    --amethyst:  #9b72cf;
    --phosphor:  #a0f0a0;
    --phosphor2: #5ab05a;
    --text:      #d4cfc5;
    --text-dim:  #706b62;
    --error:     #e05c5c;
    --tool-bg:   #0e0e16;
    --tool-border:#2a1f4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--void);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    overflow: hidden;
  }

  /* ── Grain overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.6;
  }

  /* ── Layout ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 600px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ── Header ── */
  header {
    flex-shrink: 0;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--void2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-title {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.12em;
    text-shadow: 0 0 18px rgba(200, 168, 75, 0.4);
  }

  .header-sub {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: background 0.4s, box-shadow 0.4s;
  }
  .status-dot.online  { background: var(--phosphor); box-shadow: 0 0 8px var(--phosphor2); }
  .status-dot.error   { background: var(--error); }
  .status-dot.thinking { background: var(--amethyst); box-shadow: 0 0 8px var(--amethyst); animation: pulse 1.2s ease-in-out infinite; }

  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.3 } }

  /* ── Config panel ── */
  #config-panel {
    flex-shrink: 0;
    background: var(--void3);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  #config-panel.hidden { display: none; }

  .cfg-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
    min-width: 140px;
  }

  .cfg-label {
    font-size: 9px;
    color: var(--gold-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .cfg-input {
    background: var(--void);
    border: 1px solid var(--border);
    color: var(--phosphor);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 5px 8px;
    outline: none;
    border-radius: 2px;
    width: 100%;
  }

  .cfg-input:focus { border-color: var(--gold-dim); }

  .cfg-save {
    align-self: flex-end;
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    padding: 5px 14px;
    cursor: pointer;
    letter-spacing: 0.08em;
    border-radius: 2px;
    transition: background 0.2s;
  }
  .cfg-save:hover { background: rgba(200,168,75,0.1); }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: fadeUp 0.2s ease-out both;
  }

  @keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }

  .msg-label {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .msg.user .msg-label  { color: var(--gold-dim); }
  .msg.asst .msg-label  { color: var(--amethyst); opacity: 0.7; }
  .msg.system-msg .msg-label { color: var(--text-dim); }

  .msg-body {
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .msg-body {
    color: var(--text);
    border-left: 2px solid var(--gold-dim);
    padding-left: 10px;
  }

  .msg.asst .msg-body {
    color: var(--phosphor);
    text-shadow: 0 0 12px rgba(160, 240, 160, 0.1);
  }

  .msg.system-msg .msg-body {
    color: var(--text-dim);
    font-size: 11px;
    font-style: italic;
  }

  /* ── Tool call badges ── */
  .tool-event {
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: 3px;
    padding: 6px 10px;
    font-size: 11px;
    color: var(--amethyst);
    display: flex;
    flex-direction: column;
    gap: 2px;
    animation: fadeUp 0.15s ease-out both;
  }

  .tool-name { font-weight: bold; letter-spacing: 0.05em; }
  .tool-args { color: var(--text-dim); font-size: 10px; word-break: break-all; }
  .tool-result { color: var(--phosphor2); font-size: 10px; margin-top: 2px; word-break: break-all; }

  /* ── Typing cursor ── */
  .typing-cursor::after {
    content: '▍';
    color: var(--phosphor);
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── Input bar ── */
  #input-bar {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--void2);
    padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  #user-input {
    flex: 1;
    background: var(--void3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    resize: none;
    border-radius: 2px;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  #user-input:focus { border-color: var(--gold-dim); }
  #user-input::placeholder { color: var(--text-dim); }

  #send-btn {
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    padding: 9px 16px;
    cursor: pointer;
    border-radius: 2px;
    white-space: nowrap;
    transition: background 0.15s, box-shadow 0.15s;
    align-self: flex-end;
  }

  #send-btn:hover:not(:disabled) {
    background: rgba(200,168,75,0.12);
    box-shadow: 0 0 12px rgba(200,168,75,0.2);
  }

  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ── Config toggle btn ── */
  #cfg-toggle {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    transition: color 0.2s;
  }
  #cfg-toggle:hover { color: var(--gold); }

  /* ── Scrollmark ── */
  .divider {
    text-align: center;
    font-size: 10px;
    color: var(--border);
    letter-spacing: 0.2em;
    margin: 4px 0;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <div class="header-title">⯨ ARCANUM BRIDGE ⯩</div>
      <div class="header-sub" id="status-text">configura·porta</div>
    </div>
    <button id="cfg-toggle" title="Configuration">⚙</button>
    <div class="status-dot" id="status-dot"></div>
  </header>

  <div id="config-panel">
    <div class="cfg-field">
      <span class="cfg-label">Bridge URL</span>
      <input class="cfg-input" id="cfg-url" type="url"
             placeholder="http://100.x.x.x:7432" autocomplete="off" autocorrect="off">
    </div>
    <div class="cfg-field">
      <span class="cfg-label">API Key</span>
      <input class="cfg-input" id="cfg-key" type="password"
             placeholder="your-bridge-key" autocomplete="off">
    </div>
    <button class="cfg-save" id="cfg-save-btn">SALVA</button>
  </div>

  <div id="messages">
    <div class="msg system-msg">
      <span class="msg-label">system</span>
      <span class="msg-body">Arcanum Bridge — porta inter mobile et arcanum.
Configure URL + key above, then speak.</span>
    </div>
  </div>

  <div id="input-bar">
    <textarea id="user-input" rows="1" placeholder="dic mihi…" maxlength="8000"></textarea>
    <button id="send-btn" disabled>MITTE</button>
  </div>

</div>

<script>
// ── State ─────────────────────────────────────────────────────
const state = {
  url: localStorage.getItem('bridge_url') || '',
  key: localStorage.getItem('bridge_key') || '',
  history: [],
  busy: false,
};

// ── DOM refs ──────────────────────────────────────────────────
const $msgs      = document.getElementById('messages');
const $input     = document.getElementById('user-input');
const $sendBtn   = document.getElementById('send-btn');
const $dot       = document.getElementById('status-dot');
const $statusTxt = document.getElementById('status-text');
const $cfgPanel  = document.getElementById('config-panel');
const $cfgUrl    = document.getElementById('cfg-url');
const $cfgKey    = document.getElementById('cfg-key');
const $cfgToggle = document.getElementById('cfg-toggle');
const $cfgSave   = document.getElementById('cfg-save-btn');

// ── Init ──────────────────────────────────────────────────────
$cfgUrl.value = state.url;
$cfgKey.value = state.key;
if (state.url && state.key) {
  $cfgPanel.classList.add('hidden');
  setStatus('connecting');
  ping();
} else {
  $cfgPanel.classList.remove('hidden');
}

// ── Config ────────────────────────────────────────────────────
$cfgToggle.addEventListener('click', () => {
  $cfgPanel.classList.toggle('hidden');
});

$cfgSave.addEventListener('click', () => {
  state.url = $cfgUrl.value.replace(/\/$/, '');
  state.key = $cfgKey.value;
  localStorage.setItem('bridge_url', state.url);
  localStorage.setItem('bridge_key', state.key);
  $cfgPanel.classList.add('hidden');
  setStatus('connecting');
  ping();
});

// ── Status ────────────────────────────────────────────────────
function setStatus(s, msg) {
  $dot.className = 'status-dot ' + (s === 'online' ? 'online' : s === 'error' ? 'error' : s === 'thinking' ? 'thinking' : '');
  $statusTxt.textContent = msg || { connecting:'conectens…', online:'operans', error:'error — porta clausa', thinking:'cogitans…' }[s] || s;
}

async function ping() {
  if (!state.url || !state.key) return;
  try {
    const r = await fetch(state.url + '/status', {
      headers: { 'X-Bridge-Key': state.key }
    });
    if (r.ok) {
      const d = await r.json();
      setStatus('online', `operans · ${d.model?.split('-')[1] || 'claude'}`);
      updateSendBtn();
    } else {
      setStatus('error');
    }
  } catch {
    setStatus('error');
  }
}

function updateSendBtn() {
  $sendBtn.disabled = state.busy || !state.url || !state.key;
}

// ── Messages ──────────────────────────────────────────────────
function addMsg(role, text, extra) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  const labelMap = { user:'⯨ vox·tua', asst:'⯨ arcanum', 'system-msg':'⬡ systema' };
  el.innerHTML = `<span class="msg-label">${labelMap[role]||role}</span><span class="msg-body"></span>`;
  el.querySelector('.msg-body').textContent = text;
  $msgs.appendChild(el);
  scrollDown();
  return el;
}

function addToolEvent(name, args, result) {
  const el = document.createElement('div');
  el.className = 'tool-event';
  el.innerHTML = `
    <span class="tool-name">⚙ ${name}</span>
    <span class="tool-args">${JSON.stringify(args).slice(0,120)}</span>
    ${result ? `<span class="tool-result">↳ ${result.slice(0,200)}</span>` : ''}
  `;
  $msgs.appendChild(el);
  scrollDown();
  return el;
}

function scrollDown() {
  $msgs.scrollTop = $msgs.scrollHeight;
}

// ── Auto-resize textarea ──────────────────────────────────────
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
});

$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

$sendBtn.addEventListener('click', send);

// ── Send ──────────────────────────────────────────────────────
async function send() {
  const text = $input.value.trim();
  if (!text || state.busy || !state.url || !state.key) return;

  state.busy = true;
  updateSendBtn();
  setStatus('thinking');

  $input.value = '';
  $input.style.height = 'auto';

  addMsg('user', text);
  state.history.push({ role: 'user', content: text });

  // Streaming response
  const asstEl = addMsg('asst', '');
  const bodyEl = asstEl.querySelector('.msg-body');
  bodyEl.classList.add('typing-cursor');
  let asstText = '';

  const toolElMap = {};

  try {
    const resp = await fetch(state.url + '/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Bridge-Key': state.key,
      },
      body: JSON.stringify({
        messages: state.history,
        stream: true,
      }),
    });

    if (!resp.ok) {
      const err = await resp.text();
      bodyEl.classList.remove('typing-cursor');
      bodyEl.textContent = `⚠ Error ${resp.status}: ${err}`;
      setStatus('error');
      state.busy = false;
      updateSendBtn();
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch { continue; }

        if (ev.type === 'text') {
          asstText += ev.text;
          bodyEl.textContent = asstText;
          scrollDown();

        } else if (ev.type === 'tool_call') {
          const tel = addToolEvent(ev.name, ev.input, null);
          toolElMap[ev.name + JSON.stringify(ev.input)] = tel;

        } else if (ev.type === 'tool_result') {
          // Try to update existing tool event
          const key = ev.name + JSON.stringify({});
          const anyTel = $msgs.querySelector('.tool-event:last-of-type');
          if (anyTel) {
            const res = anyTel.querySelector('.tool-result');
            if (!res) {
              const r = document.createElement('span');
              r.className = 'tool-result';
              r.textContent = '↳ ' + (ev.result || '').slice(0, 200);
              anyTel.appendChild(r);
            }
          }
          scrollDown();

        } else if (ev.type === 'done') {
          break;
        }
      }
    }

    bodyEl.classList.remove('typing-cursor');
    if (asstText) {
      state.history.push({ role: 'assistant', content: asstText });
    }
    setStatus('online');

  } catch (e) {
    bodyEl.classList.remove('typing-cursor');
    bodyEl.textContent = `⚠ Conexio fracta: ${e.message}`;
    setStatus('error');
  }

  state.busy = false;
  updateSendBtn();
  $input.focus();
}
</script>
</body>
</html>
